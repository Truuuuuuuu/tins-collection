# Supabase pauses free projects after 7 days without activity.
# This makes one tiny read every 3 days so the shop stays online.
# Add repo secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings → Secrets → Actions).
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one product id
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/products?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
